    def test_comment(): assert parse_kv("# c\n\na=1") == {"a":"1"}
    def test_dup(): assert parse_kv("a=1\na=2") == {"a":"2"}
oracle_files:
  solution.py: |
    def parse_kv(text):
        out = {}
        for line in text.splitlines():
            line = line.strip()
            if not line or line.startswith("#") or "=" not in line:
                continue
            k, v = line.split("=", 1)
            out[k.strip()] = v.strip()
        return out
