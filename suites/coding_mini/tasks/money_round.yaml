id: money-round-003
suite: coding_mini
kind: implement
instruction: 实现 round_half_up(amount, places=2)：十进制四舍五入（half-up，负数远离零），返回保留 places 位的字符串。禁止浮点运算。
tags: [decimal, medium]
files:
  solution.py: |
