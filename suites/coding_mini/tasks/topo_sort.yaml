    def topo_sort(nodes, edges):
        indeg = {n: 0 for n in nodes}
        adj = {n: [] for n in nodes}
        for u, v in edges:
            adj[u].append(v); indeg[v] += 1
        out = [n for n in sorted(nodes) if indeg[n] == 0]
        for u in list(out):
            for v in adj[u]:
                indeg[v] -= 1
                if indeg[v] == 0:
                    out.append(v)
        return out
