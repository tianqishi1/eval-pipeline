oracle_files:
  solution.py: |
    def join_csv_row(fields):
        out = []
        for f in fields:
            f = str(f)
            if any(ch in f for ch in [",", '"', "\n"]):
                f = '"' + f.replace('"', '""') + '"'
            out.append(f)
        return ",".join(out)
