tests:
  test_solution.py: |
    from solution import LRUCache
    def test_evict():
        c = LRUCache(2); c.put(1,1); c.put(2,2)
        assert c.get(1) == 1
        c.put(3,3)
        assert c.get(2) == -1 and c.get(3) == 3
    def test_update():
        c = LRUCache(2); c.put(1,1); c.put(1,10)
        assert c.get(1) == 10
oracle_files:
  solution.py: |
    from collections import OrderedDict
    class LRUCache:
        def __init__(self, capacity):
            self.cap = capacity
            self.d = OrderedDict()
        def get(self, key):
            if key not in self.d:
                return -1
            self.d.move_to_end(key)
            return self.d[key]
        def put(self, key, value):
            if key in self.d:
                self.d.move_to_end(key)
            self.d[key] = value
            if len(self.d) > self.cap:
                self.d.popitem(last=False)
